upstream api {
    server api:3000;
    keepalive 32;
}

# 링크 미리보기 봇 (카카오톡 · 디스코드 · X · 검색엔진): 글 주소를 열면 api 가 글 제목 · 요약 카드를 준다 (api/src/posts/post-preview.ts)
map $http_user_agent $preview_bot {
    default 0;
    "~(kakaotalk-scrap|Discordbot|Slackbot|Twitterbot|facebookexternalhit|TelegramBot|LinkedInBot|WhatsApp|Yeti|Googlebot|bingbot|Applebot|redditbot|Pinterestbot|Embedly|Iframely)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # 해시가 붙은 정적 파일은 내용이 바뀌면 파일명이 바뀌므로 1년 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 검색엔진용: 배포 주소에 맞춰 api 가 만든다 (api/src/common/seo.ts)
    location = /robots.txt {
        proxy_pass http://api;
    }
    location = /sitemap.xml {
        proxy_pass http://api;
    }
    # 웹 링크를 앱으로 여는 확인 파일 (api/src/common/app-links.ts)
    location ~ ^/\.well-known/(assetlinks\.json|apple-app-site-association)$ {
        proxy_pass http://api;
    }

    location ~ ^/posts/[0-9]+/?$ {
        if ($preview_bot) {
            proxy_pass http://api;
        }
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }

    # SPA: index.html 은 항상 새로 받아 최신 번들을 가리키게 한다
    location / {
        add_header Cache-Control "no-cache";
        # 다른 사이트가 이 화면을 iframe 으로 몰래 띄우지 못하게 (클릭재킹) + 기본 보안 헤더. CSP 는 index.html 의 meta
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
        try_files $uri /index.html;
    }
}
