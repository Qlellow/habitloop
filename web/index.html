<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="가볍고 편하게 이야기 나누는 커뮤니티, 루프" />
    <title>루프 커뮤니티</title>
    <!-- 카카오톡 · 디스코드 · X 등에 링크를 붙이면 보이는 미리보기 카드 (og:image 는 절대 주소여야 한다) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="루프" />
    <meta property="og:title" content="루프 · 가볍고 편하게 이야기 나누는 커뮤니티" />
    <meta property="og:description" content="관심사 채널에서 글을 쓰고, 공감하고, 친구를 초대해 보세요" />
    <meta property="og:image" content="https://habitloop-eight.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 저장된 테마를 첫 화면을 그리기 전에 적용해서 밝게 → 어둡게 깜빡이지 않게 한다 -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('loop.settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
