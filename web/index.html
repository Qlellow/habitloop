<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="가볍고 편하게 이야기 나누는 커뮤니티, 루프" />
    <title>루프 커뮤니티</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 저장된 테마를 첫 화면을 그리기 전에 적용해서 밝게 → 어둡게 깜빡이지 않게 한다 -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('loop.settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
