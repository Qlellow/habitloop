services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 적어 주세요}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 테이블은 API 가 처음 뜰 때 자동으로 만든다 (마이그레이션)
      DATABASE_URL: postgres://loop:${DB_PASSWORD:?.env 에 DB_PASSWORD 를 적어 주세요}@postgres:5432/loop
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      # 브라우저가 접속하는 주소 (CORS)
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3001}
      # 인증번호 메일 (Gmail). MAIL_PASSWORD 는 Google '앱 비밀번호' — 저장소에 올리지 말고 .env 에만 둔다
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 소셜 로그인: 사이트 바깥 주소(Redirect URI · 돌아갈 주소)와 각 회사 키. 키를 비우면 그 버튼은 '준비 중'
      SITE_URL: ${SITE_URL:-${PUBLIC_ORIGIN:-http://localhost:3001}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:80"   # 브라우저는 http://localhost:3001 (API 3000 은 내부망에서만 사용)

volumes:
  pg_data:
