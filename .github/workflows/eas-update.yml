name: 앱 미리보기 (EAS Update)

# 앱 코드를 Expo 서버에 올려서, 휴대폰의 Expo Go 로 QR 만 찍어 열 수 있게 한다 (PC 에서 코드를 실행하지 않아도 된다).
#  - PR: pr-<번호> 브랜치로 올리고, PR 에 QR 코드 댓글을 단다 (커밋을 더 올리면 같은 댓글을 고친다)
#  - main: main 브랜치로 올리고, 작업 요약(Summary)에 QR 링크를 남긴다
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions):
#  - Secret  EXPO_TOKEN          : expo.dev 액세스 토큰 (없으면 이 작업은 건너뛴다)
#  - Variable EXPO_PUBLIC_API_URL : 휴대폰이 접속할 HTTPS API 주소 (없으면 앱은 열리지만 서버에 연결되지 않는다)
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/shared/**', 'package-lock.json', '.github/workflows/eas-update.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'packages/shared/**', 'package-lock.json', '.github/workflows/eas-update.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update
    # 포크에서 온 PR 은 비밀 값을 못 쓰므로 건너뛴다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # QR 댓글
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # EXPO_PUBLIC_* 는 올리는 순간 앱 코드에 들어간다
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - name: 설정 확인
        id: check
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN 이 없어서 앱 미리보기를 건너뛰어요. 저장소 Secrets 에 EXPO_TOKEN 을 넣어 주세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_URL 이 없어요. 앱은 열리지만 서버에 연결되지 않아요. 저장소 Variables 에 HTTPS API 주소를 넣어 주세요."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: EAS 준비
        if: steps.check.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      # --auto: 커밋 메시지를 업데이트 설명으로 쓴다. 브랜치 이름은 직접 정한다 (PR 은 임시 병합 브랜치라서)
      - name: PR 미리보기 올리기 + QR 댓글
        if: steps.check.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: mobile
          qr-target: expo-go
          command: eas update --auto --non-interactive --branch pr-${{ github.event.pull_request.number }}

      - name: main 올리기
        id: main
        if: steps.check.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: mobile
          qr-target: expo-go
          comment: false
          command: eas update --auto --non-interactive --branch main

      - name: 요약에 QR 남기기
        if: steps.main.outputs.qr != ''
        env:
          QR: ${{ steps.main.outputs.qr }}
          LINK: ${{ steps.main.outputs.link }}
        run: |
          {
            echo "## 앱 미리보기 (main)"
            echo "휴대폰의 Expo Go 로 아래 QR 을 찍으면 최신 앱이 열려요."
            echo ""
            echo "![QR]($QR)"
            echo ""
            echo "[expo.dev 에서 보기]($LINK)"
          } >> "$GITHUB_STEP_SUMMARY"
