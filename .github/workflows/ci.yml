name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  web-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web — 타입 체크 + 프로덕션 빌드
        run: npm run build -w web
      - name: Mobile — 타입 체크
        run: npm run typecheck -w mobile
      - name: Mobile — Android/iOS 번들 (Expo)
        working-directory: mobile
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-export
        env:
          CI: 1
