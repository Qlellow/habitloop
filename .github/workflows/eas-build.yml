name: 앱 설치 파일 (Android APK)

# Expo 서버(EAS Build)에서 Android 설치 파일(APK)을 만든다. Expo Go 없이 휴대폰에 바로 깔 수 있다.
# Actions 탭 → 이 작업 → Run workflow 로 직접 실행한다 (빌드는 Expo 서버에서 10~20분).
# 설치 파일에 앱 코드가 들어 있어서, 업데이트를 못 받아도 들어 있는 버전으로 열린다.
# 필요한 설정: Secret EXPO_TOKEN, Variable EXPO_PUBLIC_API_URL (eas-update.yml 과 같음)
on:
  workflow_dispatch:

jobs:
  build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - name: 설정 확인
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 이 없어요. 저장소 Secrets 에 넣어 주세요."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_URL 이 없어요. 앱은 열리지만 서버에 연결되지 않아요."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: EAS 준비
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # 빌드는 Expo 서버에서 하므로 GitHub 의 변수를 빌드 프로필 환경 변수로 넘긴다 (저장소에는 남기지 않는다)
      - name: API 주소를 빌드 설정에 넣기
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            eas.build.preview.env = { ...(eas.build.preview.env || {}), EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL || "" };
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
          '

      - name: 빌드 시작
        id: build
        working-directory: mobile
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --json > build.json
          cat build.json
          echo "url=$(node -e 'const b=require("./build.json");const x=Array.isArray(b)?b[0]:b;console.log(`https://expo.dev/accounts/${x.project?.ownerAccount?.name ?? "qlellow"}/projects/${x.project?.slug ?? "loop"}/builds/${x.id}`)')" >> "$GITHUB_OUTPUT"

      - name: 요약에 링크 남기기
        env:
          URL: ${{ steps.build.outputs.url }}
        run: |
          {
            echo "## Android 설치 파일 빌드를 시작했어요"
            echo "Expo 서버에서 10~20분 걸려요. 아래 페이지가 **Finished** 가 되면 휴대폰으로 열어서 **Install** 을 누르세요."
            echo ""
            echo "- [빌드 페이지 열기]($URL)"
            echo ""
            echo "처음 설치할 때 '출처를 알 수 없는 앱 설치' 허용을 물어보면 허용해 주세요."
          } >> "$GITHUB_STEP_SUMMARY"
