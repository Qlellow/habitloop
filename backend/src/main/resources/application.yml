spring:
  application:
    name: loop-community
  profiles:
    default: local
  threads:
    virtual:
      enabled: true            # Java 21 가상 스레드로 요청 처리 (블로킹 I/O 대비 처리량 ↑)
  jpa:
    open-in-view: false        # 커넥션을 뷰 렌더링까지 붙잡지 않음
    hibernate:
      ddl-auto: validate       # 스키마는 Flyway가 관리
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: popularPosts,popularChannels,userExists
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s
  # 인증번호 메일: Gmail SMTP. 비밀번호는 코드에 두지 않고 환경 변수로만 받는다.
  # MAIL_PASSWORD 에는 Google 계정 비밀번호가 아니라 '앱 비밀번호'(16자리)를 넣는다.
  # MAIL_PASSWORD 가 비어 있으면 메일 대신 서버 로그에 인증번호를 찍는다 (로컬 개발용).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:3000}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024
  http2:
    enabled: true

management:
  health:
    mail:
      enabled: false           # 헬스 체크 때마다 SMTP 에 접속하지 않도록
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-string}
    ttl: 7d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3001}
  seed: false
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: 10m              # 인증번호 유효 시간
    resend-interval: 60s       # 같은 이메일로 다시 보내기까지 기다리는 시간

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:community;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
app:
  seed: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:community}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${DB_USER:community}
    password: ${DB_PASSWORD}          # 운영 DB 비밀번호는 기본값 없이 환경 변수로만
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
